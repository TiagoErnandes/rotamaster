    <path d="M44 12.3c-8.4 1.4-14.8 8.7-14.8 17.4 0 8.6 5.9 15.8 13.9 17.8-7.1-2.2-12.2-8.8-12.2-16.5 0-8.4 5.9-15.6 13.1-17.7z" fill="#ffffff" opacity="0.14" />
