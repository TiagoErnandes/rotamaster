      <stop offset="0%" stop-color="#173d62" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#0c1f35" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050b15" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="sparkWash" cx="22%" cy="68%" r="42%">
